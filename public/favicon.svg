<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="blade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#dc2626" />
    </linearGradient>
    <linearGradient id="ball" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
  </defs>
  <!-- Rounded App Icon Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />
  <rect x="16" y="16" width="480" height="480" rx="98" fill="none" stroke="#3b82f6" stroke-width="8" stroke-opacity="0.45" />
  <!-- Table Tennis Net / Court Line -->
  <line x1="64" y1="388" x2="448" y2="388" stroke="#38bdf8" stroke-width="10" stroke-linecap="round" stroke-opacity="0.5" />
  <!-- Racket Handle (rotated -35 deg around center 235, 250) -->
  <g transform="translate(230, 240) rotate(-35)">
    <rect x="-24" y="95" width="48" height="120" rx="14" fill="#d97706" stroke="#fef3c7" stroke-width="5" />
    <ellipse cx="0" cy="0" rx="118" ry="126" fill="url(#blade)" stroke="#ffffff" stroke-width="10" />
    <path d="M -98 70 L 98 70 A 118 126 0 0 1 -98 70 Z" fill="#1d4ed8" />
  </g>
  <!-- Pingpong Ball -->
  <circle cx="372" cy="156" r="46" fill="url(#ball)" stroke="#ffffff" stroke-width="8" />
</svg>